name: Sync SDK repos
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stlc-back-sync-main
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'qlonolink/qaip-python-staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      public_sha: ${{ steps.snapshot.outputs.public_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Snapshot public Git data without a write token
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project python scripts/release_control.py sync-snapshot \
            --trusted-sha "$GITHUB_SHA" --bundle "$RUNNER_TEMP/public.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: artifact
        with:
          name: back-sync-candidate
          path: ${{ runner.temp }}/public.bundle
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: acquire
    if: github.repository == 'qlonolink/qaip-python-staging' && github.ref == 'refs/heads/main'
    environment: stlc-sync
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Receive only this run's immutable Git data
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.acquire.outputs.artifact_id }}
        run: |
          uv run --no-project python scripts/transfer_artifact.py "$ARTIFACT_ID" "$RUNNER_TEMP/back-sync-input" \
            --repo "$GITHUB_REPOSITORY" --name back-sync-candidate --run-id "$GITHUB_RUN_ID" \
            --repository-id "$GITHUB_REPOSITORY_ID" --source-sha "$GITHUB_SHA" --file public.bundle
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          client-id: ${{ secrets.QDEVBOT_CLIENT_ID }}
          private-key: ${{ secrets.QDEVBOT_APP_PRIVATE_KEY }}
          owner: qlonolink
          repositories: qaip-python-staging
          permission-contents: write
          permission-workflows: write
      - name: Fast-forward from a fresh bare repository without running SDK code
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
          CANDIDATE_SHA: ${{ needs.acquire.outputs.public_sha }}
        run: |
          uv run --no-project python scripts/release_control.py sync \
            --candidate "$CANDIDATE_SHA" --trusted-sha "$GITHUB_SHA" \
            --bundle "$RUNNER_TEMP/back-sync-input/public.bundle" --repository "$RUNNER_TEMP/staging-writer.git"
  notify:
    needs: [acquire, publish]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: C09KBK260NL
            text: "SDK workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
