name: Promote SDKs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stlc-promote-main
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'qlonolink/qaip-python-staging' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: production
        with:
          client-id: ${{ secrets.QDEVBOT_CLIENT_ID }}
          private-key: ${{ secrets.QDEVBOT_APP_PRIVATE_KEY }}
          owner: qlonolink
          repositories: qaip-python
          permission-contents: write
          permission-workflows: write
      - name: Fast-forward production to this staging SHA
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
        run: |
          git -c credential.helper='!gh auth git-credential' fetch https://github.com/qlonolink/qaip-python.git main:refs/remotes/production/main
          git merge-base --is-ancestor production/main HEAD || {
            echo '::error::公開mainがstagingの祖先ではありません。先にback-syncを実行してください。'
            exit 1
          }
          git -c credential.helper='!gh auth git-credential' push https://github.com/qlonolink/qaip-python.git HEAD:refs/heads/main
      - name: Notify failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: C087XQH76FK
            text: "stlc promote failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
