name: CI
on:
  push:
    branches: ['**', '!integrated/**', '!stl-preview-head/**', '!stl-preview-base/**', '!generated', '!codegen/**', 'codegen/stl/**']
  pull_request:
    branches-ignore: [stl-preview-head/**, stl-preview-base/**]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: ./scripts/bootstrap
      - run: ./scripts/lint
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: ./scripts/build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: ./scripts/bootstrap
      - run: ./scripts/test
