name: CLI
on:
  pull_request:
  push:
    branches: ['release/**', 'cli/**', main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
        pydantic: [v1, v2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked SDK and test dependencies
        env:
          SDK_PYDANTIC_VARIANT: ${{ matrix.pydantic }}
        run: ./scripts/bootstrap
      - name: Test SDK retry and CLI contracts
        run: uv run --no-sync pytest --noconftest -o addopts='' tests/custom
      - name: Check installed command
        run: |
          uv run --no-sync qaip --version
          uv run --no-sync qaip schema local-file-groups
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: ./scripts/build sdk-dist
      - name: Verify isolated wheel installation with locked dependencies
        run: |
          uv export --frozen --all-extras --no-default-groups --no-emit-project -o "$RUNNER_TEMP/runtime.txt"
          uv venv wheel-check
          uv pip sync --python wheel-check/bin/python --require-hashes "$RUNNER_TEMP/runtime.txt"
          uv pip install --python wheel-check/bin/python --no-deps sdk-dist/*.whl
          uv pip check --python wheel-check/bin/python
          wheel-check/bin/qaip --version
          wheel-check/bin/qaip schema local-file-groups
