[project]
name = "qaip-cli"
version = "0.1.0"
description = "Command-line client for the qaip API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["qaip>=0.16.0,<0.17", "pydantic>=1.9.0,<3"]

[project.scripts]
qaip = "qaip_cli:main"

[project.urls]
Repository = "https://github.com/qlonolink/qaip-python"

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaip_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qaip_cli"]
